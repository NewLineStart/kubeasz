name: Docker

on:
  push:
    tags:
      - '*.*.*'


      

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3

      -
        name: Env set
        run: |
          echo "image_name=easzlab" >> $GITHUB_ENV
      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v2

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v2

      -
        name: Login to Aliyun
        uses: docker/login-action@v2
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.HUB_DOCKER_USERNAME }}
          password: ${{ secrets.HUB_DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:${{ env.image_tag }}
            ${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:latest
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:${{ env.image_tag }}
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:latest
