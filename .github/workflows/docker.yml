name: Docker

on:
  push:
    tags:
      - '*.*.*'


      

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3

      -
        name: Setup Custom Hosts
        run: |
          # 格式：IP地址 域名
          # 如果你的私有仓库域名是 registry.example.com，将其替换为实际的 IP 和域名
          sudo sh -c 'echo "58.213.134.168 harbor.nisco.cn" >> /etc/hosts'
          
          # 如果有多个域名，可以追加多行：
          # sudo sh -c 'echo "10.0.0.100 another-domain.com" >> /etc/hosts'
          
          # 验证是否写入成功
          cat /etc/hosts

      -
        name: Env set
        run: |
          echo "image_name=kubeasz" >> $GITHUB_ENV
      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v2

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: network=host

      -
        name: Login to Aliyun
        uses: docker/login-action@v2
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      -
        name: Login to Nisco
        uses: docker/login-action@v2
        with:
          registry: harbor.nisco.cn
          username: ${{ secrets.NISCO_DOCKER_USERNAME }}
          password: ${{ secrets.NISCO_DOCKER_PASSWORD }}

      -
        name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.HUB_DOCKER_USERNAME }}
          password: ${{ secrets.HUB_DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:${{ github.ref_name }}
            ${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:latest
            harbor.nisco.cn/easzlab/${{ env.image_name }}:${{ github.ref_name }}
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:${{ github.ref_name }}
            registry.cn-hangzhou.aliyuncs.com/${{ secrets.HUB_DOCKER_USERNAME }}/${{ env.image_name }}:latest
